# ============================================
# GymMaster — Nginx configuration
# Reverse proxy for API + WebSocket + Frontend
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" cliente=$ip_cliente';
    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # --- Security: Limits ---
    client_max_body_size 10m;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # --- Security: Headers ---
    # Included in every location via security-headers.conf to avoid losing them
    # when a location adds its own headers (Cache-Control, etc.)

    # --- Real client address ---
    # The Cloudflare tunnel (cloudflared) and the processes on this machine
    # come from the Docker networks (172.16.0.0/12): for them $remote_addr is
    # the gateway, the same for everyone, and the real address is in
    # CF-Connecting-IP, written by Cloudflare. Whoever comes in from the home
    # network on port 6969 arrives with their own address: a CF-Connecting-IP
    # they wrote themselves does not count, otherwise by changing it they would
    # bypass the limits on login attempts.
    geo $da_rete_docker {
        default        0;
        127.0.0.1      1;
        172.16.0.0/12  1;
    }
    map "$da_rete_docker:$http_cf_connecting_ip" $ip_cliente {
        "~^1:(?<ip>.+)$"  $ip;
        default           $remote_addr;
    }

    # --- Rate Limiting Zone ---
    # Per client: with $binary_remote_addr all the tunnel traffic was a
    # single address, and users shared the same limit
    limit_req_zone $ip_cliente zone=api:10m rate=10r/s;
    limit_req_zone $ip_cliente zone=auth:10m rate=2r/s;

    # --- Upstream Backend ---
    upstream backend_api {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        # --- Bot routes: internal network only (bot <-> backend), never from outside ---
        location /api/v1/bot/ {
            return 404;
        }

        # --- API REST ---
        location /api/ {
            include /etc/nginx/security-headers.conf;
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $ip_cliente;
            proxy_set_header X-Forwarded-For $ip_cliente;
            proxy_set_header CF-Connecting-IP $ip_cliente;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout for long operations (e.g. AI)
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # Errors handled by the backend, do not intercept
            proxy_intercept_errors off;
        }

        # --- WebSocket (Socket.io) ---
        location /socket.io/ {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $ip_cliente;
            proxy_set_header X-Forwarded-For $ip_cliente;
            proxy_set_header CF-Connecting-IP $ip_cliente;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeout (2 hours)
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # --- Frontend (React static files) ---
        location / {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Do not cache the main HTML, to avoid problems with new deploys
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Cache for static assets (1 year, immutable)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- PWA: manifest and service worker without cache ---
        location = /manifest.webmanifest {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        location = /registerSW.js {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        location = /sw.js {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # Imported by sw.js: without this rule it would get the one-year cache
        # of the .js files and an update to it would never arrive
        location = /sw-push.js {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # --- version.json: always fresh for self-updating ---
        location = /version.json {
            include /etc/nginx/security-headers.conf;
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Access-Control-Allow-Origin "*";
        }

        # --- Health Check ---
        location /salute {
            include /etc/nginx/security-headers.conf;
            proxy_pass http://backend_api/api/v1/salute;
        }
    }
}
