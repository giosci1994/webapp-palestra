# ============================================
# GymMaster — Configurazione Nginx
# Reverse proxy per API + WebSocket + Frontend
# ============================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Performance ---
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # --- Sicurezza: Limiti ---
    client_max_body_size 10m;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # --- Sicurezza: Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Rate Limiting Zone ---
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=2r/s;

    # --- Upstream Backend ---
    upstream backend_api {
        server backend:3000;
    }

    server {
        listen 80;
        server_name _;

        # --- Rotte Bot: solo rete interna (bot <-> backend), mai dall'esterno ---
        location /api/v1/bot/ {
            return 404;
        }

        # --- API REST ---
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeout per operazioni lunghe (es. AI)
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;

            # Errori gestiti dal backend, non intercettare
            proxy_intercept_errors off;
        }

        # --- Gestione Errori JSON per API ---
        location @json_errors {
            default_type application/json;
            return 500 '{"successo": false, "codice": "ERRORE_PROXY", "messaggio": "Errore di connessione o traffico limitato. Riprova tra poco."}';
        }

        # --- WebSocket (Socket.io) ---
        location /socket.io/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket timeout (2 ore)
            proxy_read_timeout 7200s;
            proxy_send_timeout 7200s;
        }

        # --- Frontend (file statici React) ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            
            # Non mettere in cache l'HTML principale per evitare problemi con i nuovi deploy
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        # Cache per asset statici (1 anno, immutable)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            root /usr/share/nginx/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # --- PWA: manifest e service worker senza cache ---
        location = /manifest.webmanifest {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        location = /registerSW.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        location = /sw.js {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache";
        }

        # --- version.json: sempre fresco per auto-aggiornamento ---
        location = /version.json {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            add_header Access-Control-Allow-Origin "*";
        }

        # --- Health Check ---
        location /salute {
            proxy_pass http://backend_api/api/v1/salute;
        }
    }
}
