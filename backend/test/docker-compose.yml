# ============================================
# GymMaster — Throwaway services for the integration tests
# ============================================
#
# test/esegui.js starts and stops them. The project name is fixed on purpose:
# the production stack is "web-apppalestra", and this one never touches it.
# Data in memory (tmpfs): the database is empty at every start.

name: gymmaster-test

services:
  db:
    # The same image as production
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gymmaster
      POSTGRES_PASSWORD: gymmaster
      POSTGRES_DB: gymmaster_test
    tmpfs:
      - /var/lib/postgresql/data
    # No fsync: the data is thrown away at the end
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    ports:
      # Port chosen by Docker, localhost only
      - "127.0.0.1::5432"
    healthcheck:
      # Over TCP: during initialization Postgres listens only on the local
      # socket, so the check passes only once the final server is up
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gymmaster -d gymmaster_test"]
      interval: 1s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
