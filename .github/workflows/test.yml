# Test a ogni pull request e a ogni push su master.
# Backend: test unitari e d'integrazione, con Postgres e Redis usa-e-getta
# avviati da Docker Compose come in locale (backend/test/esegui.js).
# Frontend: test e build.
name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Un nuovo push sullo stesso branch annulla il giro precedente
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Node 22 come l'immagine del backend (node:22-slim)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      # Un import rotto o un JSX sbagliato fanno fallire la build prima di
      # qualsiasi test
      - run: npm run build
