# Test a ogni pull request e a ogni push su master.
# Backend: test unitari e d'integrazione, con Postgres e Redis usa-e-getta
# avviati da Docker Compose come in locale (backend/test/esegui.js).
# Frontend: lint, test e build.
# Immagini: le immagini Docker di produzione si costruiscono e il backend
# parte davvero (.github/immagini/docker-compose.yml).
# Rilascio: lo script che installa le release sul server (deploy/rilascio.sh).
name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Un nuovo push sullo stesso branch annulla il giro precedente
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Node 22 come l'immagine del backend (node:22-slim)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Errori e avvisi bloccano: il frontend e' a zero e ci resta
      - run: npm run lint
      - run: npm test
      # Un import rotto o un JSX sbagliato fanno fallire la build prima di
      # qualsiasi test
      - run: npm run build

  immagini:
    # Non basta che un'immagine si costruisca: deve anche partire. Il backend
    # applica le migrazioni a un database vuoto, esegue il seed e risponde
    # come in produzione; bot e scraper (che hanno bisogno di Telegram e di
    # internet) si costruiscono e il loro codice deve caricarsi.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/immagini
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile controlli build
      - run: docker compose up -d --wait --wait-timeout 300 backend
      - name: Il backend risponde
        run: |
          docker compose exec -T backend node -e "fetch('http://localhost:3000/api/v1/salute').then(async r => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1) })"
      - name: Il codice del bot si carica
        run: docker compose --profile controlli run --rm --no-deps bot node --check bot.js
      - name: Il codice dello scraper si carica
        run: docker compose --profile controlli run --rm --no-deps --entrypoint node scraper --check scraper-affluenza.js
      - name: Log dei container
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose --profile controlli down -v

  rilascio:
    # Lo script gira da solo in produzione: shellcheck e le sue prove, con
    # docker, curl e npm finti su un repository git di prova
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/rilascio.sh deploy/test/rilascio.test.sh
      - run: bash deploy/test/rilascio.test.sh
