# Tests on every pull request and every push to master.
# Backend: unit and integration tests, with throwaway Postgres and Redis
# started by Docker Compose as locally (backend/test/esegui.js).
# Frontend: lint, tests and build.
# Images: the production Docker images are built and the backend
# really starts (.github/immagini/docker-compose.yml).
# Release: the script that installs releases on the server (deploy/rilascio.sh).
name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the previous run
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # Node 22 like the backend image (node:22-slim)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Errors and warnings block: the frontend is at zero and stays there
      - run: npm run lint
      - run: npm test
      # A broken import or bad JSX makes the build fail before
      # any test
      - run: npm run build

  immagini:
    # It is not enough for an image to build: it must also start. The backend
    # applies the migrations to an empty database, runs the seed and responds
    # as in production; bot and scraper (which need Telegram and the
    # internet) are built and their code must load.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/immagini
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile controlli build
      - run: docker compose up -d --wait --wait-timeout 300 backend
      - name: Il backend risponde
        run: |
          docker compose exec -T backend node -e "fetch('http://localhost:3000/api/v1/salute').then(async r => { console.log(r.status, await r.text()); process.exit(r.ok ? 0 : 1) })"
      - name: Il codice del bot si carica
        run: docker compose --profile controlli run --rm --no-deps bot node --check bot.js
      - name: Il codice dello scraper si carica
        run: docker compose --profile controlli run --rm --no-deps --entrypoint node scraper --check scraper-affluenza.js
      - name: Log dei container
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose --profile controlli down -v

  rilascio:
    # The script runs unattended in production: shellcheck and its tests, with
    # fake docker, curl, npm and npx on a test git repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/rilascio.sh deploy/test/rilascio.test.sh
      - run: bash deploy/test/rilascio.test.sh
