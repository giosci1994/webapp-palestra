# The release button: Actions → Rilascia → Run workflow (branch: master).
# It publishes the release of the version in version.json on the tip of
# master, after checking that it is new, has its changelog entry and that the
# tests of that commit are green (deploy/pubblica-release.sh). The server then
# installs it within a couple of minutes (deploy/rilascio.sh).
# "Solo prova" runs every check and shows the notes, without publishing.
# After a real release, the app job builds the Android and Windows apps and
# adds them to it (app.yml): the site does not wait for them.
name: Rilascia

on:
  workflow_dispatch:
    inputs:
      prova:
        description: 'Solo prova: controlla tutto ma non pubblica'
        type: boolean
        default: false

permissions:
  contents: write   # create the tag and the release
  actions: read     # read the result of the tests

# Two presses close together: the second one waits, then finds the tag already there
concurrency:
  group: rilascia
  cancel-in-progress: false

jobs:
  rilascia:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Si rilascia solo da master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Lancialo dal branch master (scelto: ${{ github.ref_name }})"
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - name: Controlli e pubblicazione
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/pubblica-release.sh ${{ inputs.prova && '--prova' || '' }}
      # The tag the script has just published (v + the version in version.json)
      - name: Tag pubblicato
        id: tag
        run: echo "tag=v$(jq -r '.versione' version.json)" >>"$GITHUB_OUTPUT"

  # The apps for that release: APK, Windows installer, latest.json, SHA256SUMS.
  # Only after a real release; if it fails the release stays as it is and
  # Actions → App → Run workflow (with the tag and "carica") redoes it.
  app:
    needs: rilascia
    if: ${{ !inputs.prova }}
    permissions:
      contents: write   # add the files to the release
    uses: ./.github/workflows/app.yml
    with:
      tag: ${{ needs.rilascia.outputs.tag }}
      carica: true
