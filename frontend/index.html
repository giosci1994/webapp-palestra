<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="theme-color" content="#030308" />
    <meta name="color-scheme" content="dark" />
    <script>
      // The theme before the first paint (the same as utils/tema.js: key, colours, "auto" = the system)
      (function () {
        var scelta = null;
        try { scelta = localStorage.getItem('gymmaster_tema'); } catch (e) { /* storage not available */ }
        var chiaro = scelta === 'chiaro' || (scelta !== 'scuro' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.setAttribute('data-tema', chiaro ? 'chiaro' : 'scuro');
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', chiaro ? 'light' : 'dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', chiaro ? '#F7F6FB' : '#030308');
      })();
    </script>
    <meta name="description" content="GymMaster — gym workout tracker with rest timer, progress stats and an AI coach" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet" />
    <title>GymMaster</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      document.addEventListener('touchmove', function(event) { 
        if (event.touches.length > 1) { 
          event.preventDefault(); 
        } 
      }, { passive: false });
    </script>
  </body>
</html>
