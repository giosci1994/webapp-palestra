# Nginx config per SPA React (all'interno del container frontend)
# Fallback tutte le rotte a index.html per React Router

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Compressione gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Cache per asset statici (JS, CSS, immagini)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manifest e service worker — no cache
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — tutte le rotte a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
