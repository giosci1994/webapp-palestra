# ============================================
# GymMaster — Docker Compose
# Deploy: docker compose up --build -d
# ============================================

# Project name set explicitly. Without this line Compose derives it from the
# folder name: moving the repo from "Web-App Palestra" to
# "Web-App_Palestra" turned the project into "web-app_palestra" and the volumes
# pointed to "web-app_palestra_pgdata" (empty) instead of
# "web-apppalestra_pgdata" (the real database). Do not touch: changing it
# disconnects the stack from its data.
name: web-apppalestra

services:
  # --- Database PostgreSQL ---
  db:
    image: postgres:17-alpine
    container_name: gymmaster-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gymmaster-rete

  # --- Redis (WebSocket sessions & Cache) ---
  redis:
    image: redis:7-alpine
    container_name: gymmaster-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gymmaster-rete

  # --- Backend Node.js ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gymmaster-backend
    restart: always
    env_file:
      - .env
    environment:
      TZ: Europe/Copenhagen
    volumes:
      - ./version.json:/version.json:ro
    # A live Node process does not mean a working API: it queries the
    # status route, which also touches the application configuration.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/salute').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gymmaster-rete

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: gymmaster-nginx
    restart: always
    ports:
      - "6969:80"
    healthcheck:
      # 127.0.0.1 and not localhost: nginx listens on IPv4 only, while
      # localhost is resolved first as ::1 and the connection would fail.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - gymmaster-rete

  # --- Crowd level scraper (Playwright + Cron) ---
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: gymmaster-scraper
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROXY_URL: ${PROXY_URL:-}
      TZ: Europe/Copenhagen
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymmaster-rete

  # --- Telegram Bot (grammY, long-polling) ---
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: gymmaster-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:3000
    # The bot works in long-polling: it answers on an internal port only after
    # Telegram has confirmed its start, so the check really tells whether it is
    # working and not just whether the process exists.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/stato').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      - backend
    networks:
      - gymmaster-rete

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  gymmaster-rete:
    driver: bridge
