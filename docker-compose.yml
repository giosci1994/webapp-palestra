# ============================================
# GymMaster — Docker Compose
# Deploy: docker compose up --build -d
# ============================================

# Nome progetto fissato esplicitamente. Senza questa riga Compose lo deriva dal
# nome della cartella: spostando il repo da "Web-App Palestra" a
# "Web-App_Palestra" il progetto diventava "web-app_palestra" e i volumi
# puntavano a "web-app_palestra_pgdata" (vuoto) invece che a
# "web-apppalestra_pgdata" (il database reale). Non toccare: cambiarlo
# scollega lo stack dai suoi dati.
name: web-apppalestra

services:
  # --- Database PostgreSQL ---
  db:
    image: postgres:17-alpine
    container_name: gymmaster-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gymmaster-rete

  # --- Redis (Sessioni WebSocket & Cache) ---
  redis:
    image: redis:7-alpine
    container_name: gymmaster-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gymmaster-rete

  # --- Backend Node.js ---
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gymmaster-backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./version.json:/version.json:ro
    # Un processo Node vivo non significa API funzionante: si interroga la
    # rotta di stato, che tocca anche la configurazione applicativa.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/salute').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gymmaster-rete

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: gymmaster-nginx
    restart: always
    ports:
      - "6969:80"
    healthcheck:
      # 127.0.0.1 e non localhost: nginx ascolta solo su IPv4, mentre
      # localhost viene risolto prima come ::1 e la connessione fallirebbe.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 60s
      timeout: 5s
      start_period: 15s
      retries: 3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - gymmaster-rete

  # --- Scraper Affluenza (Playwright + Cron) ---
  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile
    container_name: gymmaster-scraper
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PROXY_URL: ${PROXY_URL:-}
      TZ: Europe/Copenhagen
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymmaster-rete

  # --- Bot Telegram (grammY, long-polling) ---
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: gymmaster-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:3000
    # Il bot lavora in long-polling: risponde su una porta interna solo dopo
    # che Telegram ne ha confermato l'avvio, cosi' il controllo dice davvero
    # se e' operativo e non solo se il processo esiste.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/stato').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      - backend
    networks:
      - gymmaster-rete

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  gymmaster-rete:
    driver: bridge
